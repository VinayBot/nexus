[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS — a local-first multi-agent operating system built on LangGraph and Ollama."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "chromadb>=1.5.9",
    "docker>=7.2.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "opentelemetry-sdk>=1.45.1",
    "psutil>=7.2.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.20.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.4",
    "sse-starlette>=3.5.0",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "types-docker>=7.2.0.20261006",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus"]

[tool.ruff]
line-length = 100
extend-exclude = ["nexus/playbooks/templates"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["E501", "PT011", "PT018", "RUF001", "RUF002", "RUF003", "ASYNC240"]  # line length is enforced by `ruff format`

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["nexus", "tests"]
exclude = ["nexus/playbooks/templates/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_return_any = false
disable_error_code = ["method-assign", "assignment", "no-any-return"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: needs a running Ollama with the configured models (deselected by default)"]
addopts = "-m 'not live'"
