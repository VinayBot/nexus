# Weekly dependency updates, grouped so they arrive as a few reviewable PRs.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups: { frontend: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: monthly }
